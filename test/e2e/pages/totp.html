<!doctype html>
<meta charset="utf-8">
<title>Sign in - Google Accounts</title>
<h1>2-Step Verification</h1>
<p>Get a verification code from the Google Authenticator app</p>
<label>Enter code <input type="tel" name="totpPin" id="totpPin" autocomplete="one-time-code" pattern="[0-9 ]*"></label>
<!-- Unticked here, to check the extension ticks it. -->
<div><input type="checkbox" id="remember"><label for="remember">Don’t ask again on this device</label></div>
<button type="button">Try another way</button>
<button type="button" id="next">Next</button>
<script>
  const pin = document.getElementById('totpPin');
  pin.addEventListener('focus', () => {
    navigator.sendBeacon('/event', 'code-focused');
    // Stands in for me typing the code from the authenticator app.
    let i = 0;
    const type = () => {
      if (i === 6) return;
      pin.value += '123456'[i];
      i += 1;
      pin.dispatchEvent(new Event('input', { bubbles: true }));
      setTimeout(type, 80);
    };
    setTimeout(type, 300);
  });
  document.getElementById('next').addEventListener('click', () => {
    const remember = document.getElementById('remember').checked;
    navigator.sendBeacon('/event', pin.value === '123456' ? `code-submitted:remember=${remember}` : 'code-submitted-early');
    location.href = 'https://mail.google.com/mail/u/0/';
  });
</script>
