<!doctype html>
<meta charset="utf-8">
<title>Sign in - Google Accounts</title>
<h1>Welcome</h1>
<div>me@example.org</div>
<!-- Google keeps a hidden autofill input like this one; the extension must skip it. -->
<input type="password" name="hiddenPassword" aria-hidden="true" tabindex="-1" style="position:absolute;left:-9999px">
<label>Enter your password <input type="password" name="Passwd" id="password"></label>
<div id="passwordNext"><button type="button" id="next"><span>Next</span></button></div>
<script>
  const PASSWORD = 'filled-by-password-manager';
  const password = document.getElementById('password');
  password.addEventListener('focus', () => {
    navigator.sendBeacon('/event', 'password-focused');
    // Stands in for a password manager: simulate typing the password a character at a time with
    // untrusted events, which looks like typing apart from the isTrusted flag.
    let i = 0;
    const type = () => {
      if (i === PASSWORD.length) return;
      password.value += PASSWORD[i];
      i += 1;
      password.dispatchEvent(new Event('input', { bubbles: true }));
      setTimeout(type, 10);
    };
    setTimeout(type, 300);
  });
  document.getElementById('next').addEventListener('click', () => {
    navigator.sendBeacon('/event', password.value === PASSWORD ? 'password-submitted' : 'password-submitted-early');
    // Google's own sign-in (the Google loop) goes back to Gmail; app sign-ins go on to consent.
    const flow = new URLSearchParams(location.search).get('flow');
    location.href =
      { google: '/v3/signin/challenge/totp?flow=google', 'google-account': 'https://myaccount.google.com/?utm_source=sign_in_no_continue&pli=1' }[flow] ??
      '/signin/oauth/id?authuser=0&part=e2e';
  });
</script>
